# foot over the living cellular-automaton wallpaper: smoked glass, red text.
# Whitecube shows one normal window at a time, so a translucent terminal reveals
# cube-ca (the desktop automaton) behind the text. The default now uses this style;
# this explicit profile is also available with:
#   whitecube-terminal -c ~/whitecube/foot-ca.ini
# Tune alpha (0 = fully see-through, 1 = opaque) to trade cube visibility for legibility.
font=monospace:size=11
pad=18x16
bold-text-in-bright=no

[colors]
alpha=0.5
foreground=ff3b3b
background=04070d
regular0=293344
regular1=ff5a5a
regular2=a6d9bc
regular3=e9d6a3
regular4=99bcec
regular5=c8afe3
regular6=9cdae1
regular7=ff3b3b
bright0=7d8ca1
bright1=ff8a8a
bright2=c3efd6
bright3=ffe7b3
bright4=bbd5ff
bright5=e3ceff
bright6=c2f6fb
bright7=ff7a7a

[cursor]
color=04070d ff6a6a
