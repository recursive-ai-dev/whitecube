# Extra session D-Bus well-known name patterns allowed by whitecube-bus.
# Built-in defaults already permit org.whitecube.*, org.freedesktop.portal.*,
# ca.desrt.dconf, org.a11y.*, org.gtk.Notifications, org.gtk.vfs.*,
# org.kde.StatusNotifier*, org.mpris.MediaPlayer2.*, etc.
# Add one pattern per line (supports trailing '.*' or '-*' prefix wildcards).
#
# Example:
# org.mozilla.firefox.*
org.chromium.Chromium.*
com.electron.*
