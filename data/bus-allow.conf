# Extra session D-Bus well-known name patterns allowed by whitecube-bus.
# Built-in defaults already permit org.whitecube.*, org.freedesktop.portal.Desktop,
# ca.desrt.dconf, org.a11y.*, org.gtk.Notifications, org.gtk.vfs.*,
# org.kde.StatusNotifier*, org.mpris.MediaPlayer2.*, etc.
# Add one pattern per line (supports trailing '.*' or '-*' prefix wildcards).
#
# Names that could capture or remote-control the screen (portal backends,
# ScreenCast, Screenshot, RemoteDesktop, InputCapture, GNOME/KDE capture
# services) are refused even if listed here.
#
# Example:
# org.mozilla.firefox.*
org.chromium.Chromium.*
com.electron.*
