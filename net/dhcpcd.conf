# Dedicated to the selected dongle. No global DHCP configuration is read.
# No hostname is transmitted or changed. DNS goes to /run/whitecube-net/resolv.conf
# through cube-net-dns (dhcpcd -c); there is no systemd-resolved on this system.
#
# timeout 0: wait for a lease as long as it takes. With the default of 30 seconds a
# dhcpcd that serves a single interface EXITS when the timer expires, and cube-net
# then tears the whole Wi-Fi service down. cube-net's supervisor, not this timer,
# decides when a link that never gets a lease is worth a nudge.
timeout 0
clientid
vendorclassid
option domain_name_servers, domain_name, domain_search
option interface_mtu
require dhcp_server_identifier
noipv4ll
nohook wpa_supplicant, resolv.conf, hostname, ntp.conf
