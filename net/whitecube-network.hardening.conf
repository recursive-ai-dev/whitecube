# STAGED, NOT INSTALLED (apply.sh does not touch it). Optional extra sandbox for whitecube-network.service.
#   sudo install -d /etc/systemd/system/whitecube-network.service.d
#   sudo install -m 0644 net/whitecube-network.hardening.conf /etc/systemd/system/whitecube-network.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart whitecube-network.service
# Undo: sudo rm /etc/systemd/system/whitecube-network.service.d/hardening.conf && daemon-reload && restart.
#
# None of this could be exercised against the real radio and dhcpcd from the session that wrote it, which
# is why it is a drop-in rather than part of the unit. The capability list is what the two processes need:
#   cube-net:  CAP_NET_ADMIN (nl80211 keys/connect, interface up), CAP_NET_RAW (EAPOL packet socket)
#   dhcpcd:    NET_ADMIN (address, routes), NET_RAW + NET_BIND_SERVICE (DHCP on port 68), and its privilege
#              separation (SETUID SETGID SETPCAP SYS_CHROOT CHOWN DAC_OVERRIDE FOWNER KILL)
# If Wi-Fi does not come up after installing it, read "journalctl -u whitecube-network.service -b" for
# "Operation not permitted", then remove the drop-in.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_SYS_CHROOT CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL
PrivateDevices=yes
ProtectKernelTunables=yes
MemoryDenyWriteExecute=yes
ProtectClock=yes
LockPersonality=yes
